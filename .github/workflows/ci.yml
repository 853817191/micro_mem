name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 最低 3.10：源码用 `X | None` 作运行时注解（PEP 604），3.9 会在 import 阶段报错
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（editable 安装，装依赖 + 入口点 + 开发工具）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: 静态检查（ruff + mypy，不过则直接失败，不跑后续）
        run: |
          ruff check src tests
          mypy src

      - name: 建库（校验 schema.sql 与 FTS5 trigram 分词器可用）
        run: mem-build-db

      - name: 加载示例数据并重建索引
        run: |
          cp examples/knowledge/*.md data/knowledge/
          cp examples/anchors/*.md   data/anchors/
          mem rebuild | tee /tmp/rebuild.log
          # 回归守卫：rebuild 曾因计数变量未自增而恒打印 "0 条知识重建"
          grep -qE "rebuild 完成：[1-9][0-9]* 条知识重建" /tmp/rebuild.log

      - name: 校验检索可用（字面路 + 多关键词融合）
        run: |
          mem search "发酵" | tee /tmp/search1.log
          grep -q "^\[k-" /tmp/search1.log
          mem search "发酵 温度" --multi | tee /tmp/search2.log
          grep -q "^\[k-" /tmp/search2.log

      - name: 校验图遍历（parent/link 边）
        run: |
          mem traverse k-0001 --depth 2 | tee /tmp/traverse.log
          grep -q "^  k-0001 -\[parent\]→" /tmp/traverse.log

      - name: 跑测试套件（功能用例；性能用例默认排除）
        run: pytest -m "not perf"
