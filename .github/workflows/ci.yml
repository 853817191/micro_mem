name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 最低 3.10：源码用 `X | None` 作运行时注解（PEP 604），3.9 会在 import 阶段报错
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 建库（校验 schema.sql 与 FTS5 trigram 分词器可用）
        run: python build_db.py

      - name: 加载示例数据并重建索引
        run: |
          cp examples/knowledge/*.md data/knowledge/
          cp examples/anchors/*.md   data/anchors/
          python src/main.py rebuild | tee /tmp/rebuild.log
          # 回归守卫：rebuild 曾因计数变量未自增而恒打印 "0 条知识重建"
          grep -qE "rebuild 完成：[1-9][0-9]* 条知识重建" /tmp/rebuild.log

      - name: 校验检索可用（字面路 + 多关键词融合）
        run: |
          python src/main.py search "发酵" | tee /tmp/search1.log
          grep -q "^\[k-" /tmp/search1.log
          python src/main.py search "发酵 温度" --multi | tee /tmp/search2.log
          grep -q "^\[k-" /tmp/search2.log

      - name: 校验图遍历（parent/link 边）
        run: |
          python src/main.py traverse k-0001 --depth 2 | tee /tmp/traverse.log
          grep -q "^  k-0001 -\[parent\]→" /tmp/traverse.log

      - name: 跑测试套件
        run: python tests/run_tests.py
